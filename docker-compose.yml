services:
  db:
    image: pgvector/pgvector:pg16
    container_name: psychopharm-db
    environment:
      POSTGRES_USER: psych
      POSTGRES_PASSWORD: psych
      POSTGRES_DB: psychopharm
    ports:
      - "5433:5432"
    volumes:
      - psychopharm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psych -d psychopharm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  psychopharm_pgdata:
