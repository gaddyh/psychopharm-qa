[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psychopharm-qa"
version = "0.1.0"
description = "Evidence-grounded psychopharmacology QA (Stahl + NbN deterministic + Kaplan RAG)"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "streamlit>=1.36",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=1.35",
    "numpy>=1.26",
    "pypdf>=4.2",
    "pdfplumber>=0.11",
    "python-dotenv>=1.0",
    "tenacity>=8.4",
    "tiktoken>=0.7",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
